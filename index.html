    :root {  
      --bg: #09090e;        /* Darker, sleek background */
      --card: #14141f;      /* Deep premium card color */
      --muted: #8a8a9d;     /* Muted text color */
      
      /* Neon Purple to Cyan accents for buttons */  
      --accent1: #7000ff;

    }

    * {  
      margin: 0;  
      padding: 0;  
      box-sizing: border-box;
    }

    body {  
      min-height: 100vh;  
      font-family: 'Poppins', sans-serif;  
      background: linear-gradient(180deg, var(--bg), #000000);  
      display: flex;  
      flex-direction: column;  
      align-items: center;  
      justify-content: center;  
      padding: 18px;  
      color: #e9faff;
    }

    .container {  
      width: 100%;  
      max-width: 420px;
    }

    .card {  
      background: var(--card);  
      padding: 26px;  
      border-radius: 14px;  
      text-align: center;  
      border: 1px solid rgba(255, 255, 255, 0.08);  
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
    }

    /* 🔥 Vibrant Pink-Orange Title */
    .title {  
      font-size: 26px;  
      font-weight: 800;  
      background: linear-gradient(90deg, #ff007a, #ff7e00);  
      -webkit-background-clip: text;  
      -webkit-text-fill-color: transparent;  
      margin-bottom: 6px;
    }

    .subtitle {  
      font-size: 13px;  
      color: var(--muted);  
      margin-bottom: 22px;
    }

    /* Modern Button Styling */
    .btn {  
      width: 100%;  
      display: flex;  
      align-items: center;  
      justify-content: center;  
      gap: 10px;  
      padding: 14px;  
      margin-bottom: 14px;  
      border-radius: 12px;  
      background: linear-gradient(90deg, var(--accent1), var(--accent2));  
      color: #fff;  
      font-weight: 800;  
      font-size: 15px;  
      text-decoration: none;  
      box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);  
      transition: 0.3s;
    }

    .btn:hover {  
      transform: translateY(-2px);  
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.6);
    }

    .bottom-credit {  
      margin-top: 25px;  
      text-align: center;
    }

    .bottom-credit a {  
      color: var(--accent2);  
      text-decoration: none;  
      font-size: 14px;  
      font-weight: 600;  
      opacity: 0.85;  
      transition: 0.3s;
    }

    .bottom-credit a:hover {  
      opacity: 1;
      text-shadow: 0 0 10px var(--accent2);
    }
